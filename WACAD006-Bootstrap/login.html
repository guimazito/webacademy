<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body>
    <!-- login -->
    <div class="container-fluid vh-100">
      <div class="row h-100" >
        <div class="col-md-4 bg-secondary bg-opacity-25 text-center d-flex align-items-center justify-content-center">
          <h2>Bem vindo à WA Loja!</h2>
        </div>
        <div class="col-md-8 text-center d-flex align-items-center justify-content-center">
          <form class="text-start" onsubmit="entrar(event)">
            <label for="inputEmail" class="form-label">Email</label>
            <input type="email" class="form-control mb-2" id="inputEmail" required value="claudio@gmail.com">
            <label for="inputPassword" class="form-label">Senha</label>
            <input type="password" class="form-control mb-3" id="inputPassword" required value="123456">
            <button type="submit" class="btn btn-success w-100 mb-3">Entrar</button>
            <div class="d-flex justify-content-center">
              <a href="cadastro.html" class="alert-link text-center">não tenho cadastro</a>
            </div>
          </form>
        </div>
        
       </div>
    
    </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script>
    function entrar(event) {
      event.preventDefault();
      window.location.href = "index.html";
    }
  </script>

  </body>
</html>
