<style>
  button {
    cursor: pointer;
  }

  .add-btn:hover {
    background-color: lightblue;
  }

  .remove-btn:hover {
    background-color: lightcoral;
  }
</style>

<body>
  <h1>To-do</h1>

  <div>
    <p id="lista-titulo" name="lista">Lista de atividades:</p>
  </div>

  <div>
    <input placeholder="Digite aqui o item" />
    <button class="add-btn">Adicionar</button>
  </div>

  <ul id="lista-itens">
    <li>item a</li>
  </ul>

  <div>
    <button class="remove-btn">Remover último item</button>
  </div>
</body>

<script>
  function addItem() {
    const input = document.querySelector('input');
    const newItem = input.value;
    if (newItem.trim() !== '') {
      const ul = document.getElementById('lista-itens');
      const li = document.createElement('li');
      li.textContent = newItem;
      ul.appendChild(li);
      input.value = '';
    } else {
      alert('Não é permitido adicionar itens vazios!');
      input.value = '';
    }
  }

  function removeItem() {
    const ul = document.getElementById('lista-itens');
    if (ul.childElementCount > 1) {
      ul.removeChild(ul.lastElementChild);
    } else {
      alert('A lista não pode ficar vazia!');
    }
  }

  let addButton = document.querySelectorAll('button')[0];
  addButton.addEventListener('click', addItem);

  let removeButton = document.querySelectorAll('button')[1];
  removeButton.addEventListener('click', removeItem);  
</script>
