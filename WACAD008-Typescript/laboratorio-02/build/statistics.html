<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Escola App</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body class="container-100 bg-dark text-light">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Escola XPTO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Alunos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="class.html">Classes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="statistics.html">Estatísticas</a>
            </li>
          </ul>
          <a id="exit" href="statistics.html" class="btn btn-secondary ms-auto">Sair</a>
        </div>
      </div>
    </nav>
    <!-- navbar -->

    <div class="container text-center">
      <h1 class="d-flex justify-content-start mt-5">Minhas Estatísticas</h1>
      <table class="table border table-dark table-borderless mt-5">
        <thead>
          <tr style="border-bottom:2px solid #888;">
            <th scope="col">Classe</th>
            <th scope="col">Estatística</th>
            <th scope="col">Resultado</th>
          </tr>
        </thead>
        <tbody class="align-middle">
        </tbody>
      </table>
    </div>   

    <script>                        
      async function fetchStatistics() {
          const response = await fetch("http://localhost:4000/api/statistics");
          const statistics = await response.json();
          const tbody = document.querySelector("table tbody")
          tbody.innerHTML = "";

          statistics.forEach((statistic, index) => {

              const tr1 = document.createElement("tr");
              tr1.innerHTML = `
                  <th scope="row" rowspan="4">${statistic.className}</th>
                  <td>Número de Estudantes</td>
                  <td>${statistic.numStudents ? statistic.numStudents : ""}</td>
              `;
              tbody.appendChild(tr1);

              const tr2 = document.createElement("tr");
              tr2.innerHTML = `
                  <td>Idade Média</td>
                  <td>${statistic.averageAge ? statistic.averageAge : ""}</td>
              `;
              tbody.appendChild(tr2);

              const tr3 = document.createElement("tr");
              tr3.innerHTML = `
                  <td>Altura Média</td>
                  <td>${statistic.averageHeight ? statistic.averageHeight : ""}</td>
              `;
              tbody.appendChild(tr3);

              const tr4 = document.createElement("tr");
              tr4.innerHTML = `
                  <td>Peso Médio</td>
                  <td>${statistic.averageWeight ? statistic.averageWeight : ""}</td>
              `;
              tbody.appendChild(tr4);
              
              if (index < statistics.length - 1) {
                const trSeparator = document.createElement("tr");
                trSeparator.innerHTML = `<td colspan="3" style="border-bottom:2px solid #888;"></td>`;
                tbody.appendChild(trSeparator);
              }
          });
      };
      
      fetchStatistics();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

  </body>
</html>
