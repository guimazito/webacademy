<!DOCTYPE html>
<html lang="en">

          <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse" id="navbarNav">

    <div class="container text-center">
      <h1 class="d-flex justify-content-start mt-5">Minhas Classes</h1>
      <div class="d-flex justify-content-end align-items-end mb-3 mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNewClass">Nova Classe</button>
      </div>
      <table class="table border table-dark table-striped">
        <thead>
          <tr>
            <th scope="col">id</th>
            <th scope="col">Nome</th>
            <th scope="col">Alunos</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody>       
        </tbody>
      </table>
    </div>

    <!-- modal new class -->
    <div class="modal" id="modalNewClass" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header">
            <h5 class="modal-title">Adicionar Classe</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form>
            <div class="modal-body text-start">
              <input type="text" class="form-control" id="newName" placeholder="Insira o nome" required>              
            </div>
            <div class="modal-footer border-0">
              <button type="submit" class="btn btn-success w-100" id="addClassButton">Confirmar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- modal new class -->

    <!-- modal edit class -->
    <div class="modal" id="modalEditClass" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header">
            <h5 class="modal-title">Editar Classe</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form>
            <div class="modal-body text-start">
              <input type="text" class="form-control" id="editName" required>
            </div>
            <div class="modal-footer border-0">
              <button type="submit" class="btn btn-success w-100">Confirmar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- modal edit class -->

    <script>
      document.getElementById("addClassButton").addEventListener("click", async () => {
          const name = document.getElementById("newName").value;          
          if (!name) return alert("O nome não pode estar vazio!");
          
          const response = await fetch("http://localhost:4000/api/classes", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify({ name })
          });

          if (response.ok) {
              const data = await response.json();
              newName.value = "";
              newAge.value = "";
          } else {
              alert("Erro ao adicionar aluno!");
          }
      fetchClasses();
      });
                        
      async function fetchClasses() {
          const response = await fetch("http://localhost:4000/api/classes");
          const classes = await response.json();
          const tbody = document.querySelector("table tbody")
          tbody.innerHTML = "";

          classes.forEach((classs, index) => {

              const tr = document.createElement("tr");
              const studentNames = Array.isArray(classs.students)
                ? classs.students.map(student => student.name).join(", ")
                : classs.students;

              tr.innerHTML = `
                  <th scope="row">${classs.id}</th>
                  <td>${classs.name}</td>
                  <td>${studentNames}</td>
                  <td>
                    <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modalEditClass" id=edit-${classs.id}>Editar</button>
                    <button type="button" class="btn btn-danger" id=delete-${classs.id}>Excluir</button>
                  </td>
              `;
              tbody.appendChild(tr);

              tr.querySelector(`#delete-${classs.id}`).addEventListener("click", async () => {
                  await fetch(`http://localhost:4000/api/classes/${classs.id}`, {
                      method: "DELETE"
                  });
                  fetchClasses();
              });

              tr.querySelector(`#edit-${classs.id}`).addEventListener("click", () => {
                  const modal = document.getElementById("modalEditClass");
                  const editNameInput = modal.querySelector("#editName");
                  editNameInput.value = classs.name;

                  modal.querySelector("form").onsubmit = async (e) => {
                      e.preventDefault();
                      const editName = editNameInput.value;
                      await fetch(`http://localhost:4000/api/classes/${classs.id}`, {
                          method: "PUT",
                          headers: {
                              "Content-Type": "application/json"
                          },
                          body: JSON.stringify({ name: editName })
                      });
                      fetchClasses();
                      modal.querySelector(".btn-close").click();
                  };
              });
          });       
      };
      
      fetchClasses();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

  </body>
</html>
