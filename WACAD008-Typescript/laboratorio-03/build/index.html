<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja XPTO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="bg-dark text-light">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Loja XPTO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">Produtos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="stock.html">Estoque</a>
            </li>
          </ul>
          <a href="" class="btn btn-secondary ms-auto">Sair</a>
        </div>
      </div>
    </nav>
    <!-- navbar -->
    
    <div class="container-fluid vh-100">
      <div class="row h-100" >
        <!-- stock list -->
        <div class="container col-md-8 bg-secondary bg-opacity-25 text-center">
            <div id="stock-list" class="row row-cols-1 row-cols-md-4 row-cols-sm-2 g-3 mt-2">
            </div>
        </div>
        <!-- stock list -->

        <!-- cart list -->
        <div class="container col-md-4 text-center">
            <div class="mb-3 mt-2">
                <h5>Carrinho de Compras</h5>
            </div>
            <div id="cart-total" class="d-flex align-items-end justify-content-end mb-3 mt-2">
            </div>
            <table id="cart-list" class="table border table-dark">
                <thead>
                <tr>
                    <th scope="col">Produto</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Ação</th>
                </tr>
                </thead>
                <tbody class="align-middle">
                </tbody>
            </table>
        </div>
        <!-- cart list -->
    </div>

    <script>
        async function fetchStock() {
            const response = await fetch('http://localhost:4000/api/stock');
            const stockItems = await response.json();
            const stockList = document.getElementById("stock-list")
            stockList.innerHTML = "";

            stockItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "col";
                card.innerHTML = `
                    <div class="card">
                        <img src="assets/${item.image}.png" class="card-img-top">
                        <div class="card-body d-flex align-items-start flex-column bg-secondary bg-opacity-100 card-img-bottom">
                            <h5 class="card-title">${item.model}</h5>
                            <p class="card-text">R$ ${item.price.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</p>
                            <p class="card-text">Marca: ${item.brand}</p>
                            ${item.resolution ? `<p class="card-text">Resolução: ${item.resolution}</p>` : ""}
                            ${item.screenSize ? `<p class="card-text">Polegadas: ${item.screenSize}'</p>` : ""}
                            ${item.memory ? `<p class="card-text">Memória: ${item.memory} GB</p>`: ""}
                            ${item.rimSize ? `<p class="card-text">Aro: ${item.rimSize}</p>`: ""}
                            <button type="button" class="btn btn-primary w-100 mt-auto" id=add-${item.id}>Adicionar no carrinho</button>
                        </div>
                    </div>
                `;
                stockList.appendChild(card);

                card.querySelector(`#add-${item.id}`).addEventListener("click", async (event) => {
                    event.preventDefault();
                    await fetch('http://localhost:4000/api/cart/add', {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ id: item.id })
                    });
                    fetchCart();
                    fetchStock();
                    fetchTotal();
                });
            });
        }

        async function fetchTotal() {
            const response = await fetch("http://localhost:4000/api/cart/total");
            const cart = await response.json();
            const cartTotal = document.getElementById("cart-total");
            cartTotal.innerHTML = `<h5>Total: ${cart.total.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</h5>`;
        }

        async function fetchCart() {
            const response = await fetch('http://localhost:4000/api/cart');
            const cartItems = await response.json();
            const tbody = document.querySelector("#cart-list tbody");
            tbody.innerHTML = "";

            cartItems.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <th scope="row">${item.model}</th>
                    <td>${item.price.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</td>
                    <td>
                        <button type="button" class="btn btn-danger" id=remove-${item.id}>Remover</button>
                    </td>
                `;
                tbody.appendChild(tr);

                const removeButton = tr.querySelector(`#remove-${item.id}`);
                removeButton.addEventListener("click", async (event) => {
                    event.preventDefault();
                    await fetch('http://localhost:4000/api/cart/remove', {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ id: item.id })
                    });
                    fetchCart();
                    fetchStock();
                    fetchTotal();
                });
            });
        }

        fetchCart();
        fetchStock();
        fetchTotal();
    </script>    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script> 

  </body>
</html>
