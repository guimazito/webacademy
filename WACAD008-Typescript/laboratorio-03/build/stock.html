<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Loja XPTO</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
      <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="container-100 bg-dark text-light">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Loja XPTO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Produtos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="stock.html">Estoque</a>
            </li>
          </ul>
          <a href="" class="btn btn-secondary ms-auto">Sair</a>
        </div>
      </div>
    </nav>
    <!-- navbar -->

    <div class="container text-center">
      <h1 class="d-flex justify-content-start mt-5">Meu Estoque</h1>
      <div class="d-flex justify-content-end align-items-end mb-3 mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNewProduct">Novo Produto</button>
      </div>
      <table class="table border table-dark table-striped">
        <thead>
          <tr>
            <th scope="col">id</th>
            <th scope="col">Modelo</th>
            <th scope="col">Marca</th>
            <th scope="col">Resolução</th>
            <th scope="col">Polegadas</th>
            <th scope="col">Memória</th>
            <th scope="col">Aro</th>
            <th scope="col">Quantidade</th>
            <th scope="col">Preço</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody class="align-middle">       
        </tbody>
      </table>
    </div>

    <!-- modal new product -->
    <div class="modal" id="modalNewProduct" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header">
            <h5 class="modal-title">Adicionar Produto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form>
            <div class="modal-body text-start">              
              <label for="newType" class="form-label">Categoria</label>
              <select class="form-select mb-2" id="newType" required>
                <option value="" selected disabled>Selecione a categoria</option>
                <option value="1">TV</option>
                <option value="2">Celular</option>
                <option value="3">Bicicleta</option>
              </select>
              <label for="newModel" class="form-label">Modelo</label>
              <input type="text" class="form-control mb-2" id="newModel" placeholder="Insira o modelo" required>
              <label for="newBrand" class="form-label">Marca</label>
              <input type="text" class="form-control mb-2" id="newBrand" placeholder="Insira a marca" required>
              <label for="newPrice" class="form-label">Preço</label>
              <input type="number" class="form-control mb-2" id="newPrice" placeholder="Insira o preço" required>
              <label for="newQuantity" class="form-label">Quantidade</label>
              <input type="number" class="form-control mb-2" id="newQuantity" placeholder="Insira a quantidade" required>
              <div id="inputNewTv">
                <label for="newResolution" class="form-label">Resolução</label>
                <input type="text" class="form-control mb-2" id="newResolution" placeholder="Insira a resolução" required>
                <label for="newScreenSize" class="form-label">Polegadas</label>
                <input type="text" class="form-control" id="newScreenSize" placeholder="Insira o tamanho da tela" required>
              </div>
              <div id="inputNewCellphone">
                <label for="newMemory" class="form-label">Memória</label>
                <input type="text" class="form-control" id="newMemory" placeholder="Insira a memória" required>
              </div>
              <div id="inputNewBike">
                <label for="newRimSize" class="form-label">Aro</label>
                <input type="text" class="form-control" id="newRimSize" placeholder="Insira o tamanho do aro" required>
              </div>
            </div>
            <div class="modal-footer border-0">
                <button type="submit" class="btn btn-success w-100" id="addProductButton">Confirmar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- modal new product -->

    <!-- modal edit product -->
    <div class="modal" id="modalEditProduct" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header">
            <h5 class="modal-title">Editar Produto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form>
            <div class="modal-body text-start">              
              <label for="editModel" class="form-label">Modelo</label>
              <input type="text" class="form-control mb-2" id="editModel" placeholder="Insira o modelo" required>
              <label for="editBrand" class="form-label">Marca</label>
              <input type="text" class="form-control mb-2" id="editBrand" placeholder="Insira a marca" required>
              <label for="editPrice" class="form-label">Preço</label>
              <input type="number" class="form-control mb-2" id="editPrice" placeholder="Insira o preço" required>
              <label for="editQuantity" class="form-label">Quantidade</label>
              <input type="number" class="form-control mb-2" id="editQuantity" placeholder="Insira a quantidade" required>
              <div id="inputEditTv">
                <label for="editResolution" class="form-label">Resolução</label>
                <input type="text" class="form-control mb-2" id="editResolution" placeholder="Insira a resolução">
                <label for="editScreenSize" class="form-label">Polegadas</label>
                <input type="text" class="form-control" id="editScreenSize" placeholder="Insira o tamanho da tela">
              </div>
              <div id="inputEditCellphone">
                <label for="editMemory" class="form-label">Memória</label>
                <input type="text" class="form-control" id="editMemory" placeholder="Insira a memória">
              </div>
              <div id="inputEditBike">
                <label for="editRimSize" class="form-label">Aro</label>
                <input type="text" class="form-control" id="editRimSize" placeholder="Insira o tamanho do aro">
              </div>
            </div>
            <div class="modal-footer border-0">
              <button type="submit" class="btn btn-success w-100">Confirmar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- modal edit product -->

    <script>
      const selectType = document.getElementById("newType");
      const inputNewTv = document.getElementById("inputNewTv");
      const inputNewCellphone = document.getElementById("inputNewCellphone");
      const inputNewBike = document.getElementById("inputNewBike");
      selectType.addEventListener("change", (event) => {
          event.preventDefault();
          const selectedValue = event.target.value;
          if (selectedValue == 1) {
            inputNewTv.style.display = "block";
            inputNewCellphone.style.display = "none";
            inputNewBike.style.display = "none";
          } else if (selectedValue == 2) {
            inputNewCellphone.style.display = "block";
            inputNewTv.style.display = "none";
            inputNewBike.style.display = "none";
          } else if (selectedValue == 3) {
            inputNewBike.style.display = "block";
            inputNewCellphone.style.display = "none";
            inputNewTv.style.display = "none";
          } else {
              inputNewTv.style.display = "none";
              inputNewCellphone.style.display = "none";
              inputNewBike.style.display = "none";
          }
      });

      document.getElementById("addProductButton").addEventListener("click", async (event) => {
          event.preventDefault();
          const model = document.getElementById("newModel").value;
          const brand = document.getElementById("newBrand").value;
          const price = document.getElementById("newPrice").value;
          const quantity = document.getElementById("newQuantity").value;
          const resolution = document.getElementById("newResolution").value;
          const screenSize = document.getElementById("newScreenSize").value;
          const memory = document.getElementById("newMemory").value;
          const rimSize = document.getElementById("newRimSize").value;
          const type = document.getElementById("newType").value;

          if (!model || !brand || !price || !quantity || !type) return alert("Nenhum campo pode estar vazio!");
          
          const response = await fetch("http://localhost:4000/api/stock", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model,
                brand,
                price,
                quantity,
                resolution,
                screenSize,
                memory,
                rimSize,
                type,
              })
          });

          if (response.ok) {
              const data = await response.json();
              newModel.value = "";
              newBrand.value = "";
              newPrice.value = "";
              newQuantity.value = "";
              newResolution.value = "";
              newScreenSize.value = "";
              newMemory.value = "";
              newRimSize.value = "";
              document.querySelector("#modalNewProduct .btn-close").click();
          } else {
              alert("Erro ao adicionar produto!");
          }
      fetchStock();
      });
                        
        async function fetchStock() {
            const response = await fetch("http://localhost:4000/api/stock");
            const products = await response.json();
            const tbody = document.querySelector("table tbody")
            tbody.innerHTML = "";

            products.forEach((product, index) => {

              const tr = document.createElement("tr");

              tr.innerHTML = `
                  <th scope="row">${product.id}</th>
                  <td>${product.model}</td>
                  <td>${product.brand}</td>
                  ${product.resolution ? `<td>${product.resolution}</td>` : `<td>-</td>`}
                  ${product.screenSize ? `<td>${product.screenSize}</td>` : `<td>-</td>`}
                  ${product.memory ? `<td>${product.memory}</td>` : `<td>-</td>`}
                  ${product.rimSize ? `<td>${product.rimSize}</td>` : `<td>-</td>`}
                  <td>${product.quantity}</td>
                  <td>${product.price.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</td>
                  <td>
                      <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modalEditProduct" id=edit-${product.id}>Editar</button>
                      <button type="button" class="btn btn-danger" id=delete-${product.id}>Excluir</button>
                  </td>
              `;
              tbody.appendChild(tr);

              tr.querySelector(`#delete-${product.id}`).addEventListener("click", async (event) => {
                  event.preventDefault();
                  await fetch(`http://localhost:4000/api/stock/${product.id}`, {
                      method: "DELETE"
                  });
                  fetchStock();
              });

              tr.querySelector(`#edit-${product.id}`).addEventListener("click", (event) => {
                  event.preventDefault();
                  const modal = document.getElementById("modalEditProduct");
                  const editModelInput = modal.querySelector("#editModel");
                  const editBrandInput = modal.querySelector("#editBrand");
                  const editPriceInput = modal.querySelector("#editPrice");
                  const editQuantityInput = modal.querySelector("#editQuantity");
                  const editResolutionInput = modal.querySelector("#editResolution");
                  const editScreenSizeInput = modal.querySelector("#editScreenSize");
                  const editMemoryInput = modal.querySelector("#editMemory");
                  const editRimSizeInput = modal.querySelector("#editRimSize");
                  const inputEditTv = modal.querySelector("#inputEditTv");
                  const inputEditCellphone = modal.querySelector("#inputEditCellphone");
                  const inputEditBike = modal.querySelector("#inputEditBike");
                  
                  if (product.resolution) {
                    inputEditTv.style.display = "block";
                    inputEditCellphone.style.display = "none";
                    inputEditBike.style.display = "none";
                    editResolutionInput.value = product.resolution;
                    editScreenSizeInput.value = product.screenSize;
                  } else if (product.memory) {
                      inputEditTv.style.display = "none";
                      inputEditCellphone.style.display = "block";
                      inputEditBike.style.display = "none";
                      editMemoryInput.value = product.memory;
                  } else if (product.rimSize) {
                      inputEditTv.style.display = "none";
                      inputEditCellphone.style.display = "none";
                      inputEditBike.style.display = "block";
                      editRimSizeInput.value = product.rimSize;
                  } else {
                      inputEditTv.style.display = "none";
                      inputEditCellphone.style.display = "none";
                      inputEditBike.style.display = "none";
                  }

                  editModelInput.value = product.model;
                  editBrandInput.value = product.brand;
                  editPriceInput.value = product.price;
                  editQuantityInput.value = product.quantity;             

                  modal.querySelector("form").onsubmit = async (e) => {
                      e.preventDefault();
                      const editModel = editModelInput.value;
                      const editBrand = editBrandInput.value;
                      const editPrice = editPriceInput.value;
                      const editQuantity = editQuantityInput.value;
                      const editResolution = editResolutionInput.value;
                      const editScreenSize = editScreenSizeInput.value;
                      const editMemory = editMemoryInput.value;
                      const editRimSize = editRimSizeInput.value;

                      if (inputEditTv.style.display === "block") {
                          editResolutionInput.required = true;
                          editScreenSizeInput.required = true;
                      } else if (inputEditCellphone.style.display === "block") {
                          editMemoryInput.required = true;
                      } else if (inputEditBike.style.display === "block") {
                          editRimSizeInput.required = true;
                      }

                      await fetch(`http://localhost:4000/api/stock/${product.id}`, {
                          method: "PUT",
                          headers: {
                              "Content-Type": "application/json"
                          },
                          body: JSON.stringify({
                            model: editModel,
                            brand: editBrand,
                            price: editPrice,
                            quantity: editQuantity,
                            resolution: editResolution,
                            screenSize: editScreenSize,
                            memory: editMemory,
                            rimSize: editRimSize,
                          })
                      });
                      fetchStock();
                      modal.querySelector(".btn-close").click();
                  };
              });
            });       
      };
      
      fetchStock();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

  </body>
</html>
