<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body style="background-color: black; color: white">
    <h1>Reminders</h1>
    <input type="text" id="reminderInput" placeholder="Enter a reminder">
    <button id="addReminderButton">Add Reminder</button>
    <div class="container text-center">
      <div class="d-flex align-items-start mb-3 mt-5">
        <h5>Gerenciar Lembretes:</h5>
      </div>
      <div class="d-flex justify-content-end align-items-end mb-3 mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEditReminderrr">Novo Lembrete</button>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">id</th>
            <th scope="col">Lembrete</th>
            <th scope="col">Data</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody>       
        </tbody>
      </table>
    </div>

    <!-- modal edit reminder -->
    <div class="modal" id="modalEditReminder" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar Lembrete</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form>
            <div class="modal-body text-start">
              <label for="newProduct" class="form-label">Produto</label>
              <input type="text" class="form-control mb-3" id="newProduct" required>
            </div>
            <div class="modal-footer border-0">
              <button type="submit" class="btn btn-success w-100">Confirmar Cadastro</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- modal edit reminder -->

    <script>
        document.getElementById("addReminderButton").addEventListener("click", async () => {
            const title = document.getElementById("reminderInput").value;
            if (!title) return alert("Insira um lembrete!");
            
            const response = await fetch("http://localhost:3000/api/reminder", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ title })
            });

            if (response.ok) {
                const data = await response.json();
                reminderInput.value = "";
                // alert("Lembrete adicionado com sucesso!")
            } else {
                alert("Erro ao adicionar lembrete!");
            }
        fetchReminders();
        });
                        
        async function fetchReminders() {
            const response = await fetch("http://localhost:3000/api/reminder");
            const reminders = await response.json();
            const tbody = document.querySelector("table tbody")
            tbody.innerHTML = "";

            reminders.forEach((reminder, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <th scope="row">${index + 1}</th>
                    <td>${reminder.title}</td>
                    <td>${new Date(reminder.createdAt).toLocaleString()}</td>
                    <td>
                        <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modalEditReminder" id=edit-${reminder._id}>Editar</button>
                        <button type="button" class="btn btn-danger" id=delete-${reminder._id}>Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);

                tr.querySelector(`#delete-${reminder._id}`).addEventListener("click", async () => {
                    await fetch(`http://localhost:3000/api/reminder/${reminder._id}`, {
                        method: "DELETE"
                    });
                    fetchReminders();
                });
            });
        }
        fetchReminders();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</body>
</html>
